name: "audio.cpp"
version: "0.9.4.9"
slug: "audiocpp"
description: "Local audio inference server: text-to-speech, speech-to-text, VAD and more (CPU or Vulkan)"
url: "https://github.com/0xShug0/audio.cpp"
arch:
  - aarch64
  - amd64
init: false
startup: services
ingress: true
ingress_port: 8099
panel_icon: "mdi:waveform"
panel_title: "audio.cpp"
panel_admin: false
devices:
  # iGPU for the Vulkan backend. Individual device nodes: the Supervisor maps
  # these with --device; a directory path such as /dev/dri is not enough and the
  # nodes end up bind-mounted but unusable (EPERM). Without them the add-on
  # still runs on CPU.
  - /dev/dri/card0
  - /dev/dri/renderD128
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "audio.cpp HTTP API (OpenAI-compatible) and WebUI"
map:
  - type: share
    read_only: false
options:
  backend: "cpu"
  threads: 3
  asr_model: "canary_180m_flash_q8_0"
  asr_language: "es"
  asr_punc: false
  tts_model: "pocket_tts_spanish_q8_0"
  tts_voice: "rafael"
  tts_voice_ref: ""
  tts_language: "es"
  tts_speed: 1.0
  max_loaded_models: 2
  hf_token: ""
schema:
  backend: "list(cpu|vulkan)"
  threads: "int(1,8)"
  asr_model: "list(canary_180m_flash_q8_0|qwen3_asr_0_6b_q8_0|nemotron_asr_q8_0|none)"
  asr_language: "list(es|es-419|en|pt|fr|de|it)"
  asr_punc: "bool"
  tts_model: "list(pocket_tts_spanish_q8_0|pocket_tts_english_q8_0|kokoro_82m_q8_0|chatterbox_q8_0|qwen3_tts_0_6b_q8_0|none)"
  tts_voice: "str"
  tts_voice_ref: "str"
  tts_language: "list(es|en|pt|fr|de|it|nl|pl|sv|da|no|fi|tr|el|hi|ko|ms|sw|ar)"
  tts_speed: "float(0.5,2.0)"
  max_loaded_models: "int(1,4)"
  hf_token: "password"
image: "ghcr.io/grunjol/addon-audiocpp"
watchdog: "tcp://[HOST]:[PORT:8099]"
